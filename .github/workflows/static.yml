---

name: static analysis

permissions:
  contents: read

on:
  pull_request: &ignore-paths
    paths-ignore:
      - '.github/CONTRIBUTING.md'
      - '.github/FUNDING.yml'
      - '.github/SECURITY.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE.md'
      - 'UPGRADE.md'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'

  push: *ignore-paths

jobs:
  phpstan:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@7a2d60325d59c5c9377fd445c912f2f1bfacf9d9 # v2.0.2
    with:
      extensions: 'grpc, protobuf'
